apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnn-chile-test
  namespace: cnn-chile
  labels:
    app: cnn-chile-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cnn-chile-test
  template:
    metadata:
      labels:
        app: cnn-chile-test
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: cnn-chile-test-service
  namespace: cnn-chile
  labels:
    app: cnn-chile-test
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: cnn-chile-test
