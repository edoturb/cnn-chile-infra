apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: cnn-chile
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://cnnchile.com,https://www.cnnchile.com"
  RATE_LIMIT_WINDOW: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: cnn-chile
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  JWT_EXPIRATION: "24h"
  BCRYPT_ROUNDS: "12"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: content-service-config
  namespace: cnn-chile
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  CACHE_TTL: "300"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-service-config
  namespace: cnn-chile
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  HLS_SEGMENT_DURATION: "6"
  DASH_SEGMENT_DURATION: "6"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: cnn-chile
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  STRIPE_WEBHOOK_SECRET: ""
  CURRENCY: "USD"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: cnn-chile
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  EMAIL_RATE_LIMIT: "10"
  PUSH_BATCH_SIZE: "1000"
