apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cnn-chile
  labels:
    app: cnn-chile
    component: config
data:
  # Database Configuration
  DB_HOST: "cnn-chile-db.cluster-xyz.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "cnnchile_db"
  DB_SSL: "true"
  
  # Redis Configuration
  REDIS_HOST: "cnn-chile-cache.abc123.cache.amazonaws.com"
  REDIS_PORT: "6379"
  REDIS_SSL: "true"
  
  # Application Configuration
  APP_ENV: "production"
  APP_DEBUG: "false"
  LOG_LEVEL: "info"
  
  # API Configuration
  API_VERSION: "v1"
  API_RATE_LIMIT: "1000"
  API_TIMEOUT: "30"
  
  # CDN Configuration
  CDN_URL: "https://cdn.cnnchile.com"
  STATIC_URL: "https://static.cnnchile.com"
  
  # Streaming Configuration
  STREAMING_URL: "https://streaming.cnnchile.com"
  HLS_SEGMENT_DURATION: "6"
  
  # Security Configuration
  CORS_ORIGINS: "https://cnnchile.com,https://www.cnnchile.com"
  JWT_ALGORITHM: "RS256"
  SESSION_TIMEOUT: "3600"
  
  # Monitoring Configuration
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  HEALTH_CHECK_INTERVAL: "30"
