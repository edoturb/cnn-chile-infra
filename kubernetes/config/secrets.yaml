apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: cnn-chile
type: Opaque
data:
  # Estos valores deben ser actualizados con los reales después del despliegue
  # Los valores están en base64
  host: Y25uLWNoaWxlLWRldi5jZHJ4eHh4eC51cy1lYXN0LTEucmRzLmFtYXpvbmF3cy5jb20= # Placeholder
  username: cG9zdGdyZXM= # postgres
  password: dGVtcG9yYWwtcGFzc3dvcmQ= # temporal-password
  database: Y25uX2NoaWxl # cnn_chile
  port: NTQzMg== # 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: cnn-chile
type: Opaque
data:
  # Estos valores deben ser actualizados con los reales después del despliegue
  endpoint: Y25uLWNoaWxlLWRldi1yZWRpcy54eHh4eC5jYWNoZS5hbWF6b25hd3MuY29t # Placeholder
  port: NjM3OQ== # 6379
  auth_token: dGVtcG9yYWwtYXV0aC10b2tlbg== # temporal-auth-token
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: cnn-chile
type: Opaque
data:
  # Para acceso a servicios AWS desde los pods
  # Estos deben configurarse con el Service Account correcto
  aws_access_key_id: ""
  aws_secret_access_key: ""
  aws_region: dXMtZWFzdC0x # us-east-1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnn-chile-service-account
  namespace: cnn-chile
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::220017832616:role/eks-pod-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: cnn-chile
  name: cnn-chile-role
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnn-chile-role-binding
  namespace: cnn-chile
subjects:
- kind: ServiceAccount
  name: cnn-chile-service-account
  namespace: cnn-chile
roleRef:
  kind: Role
  name: cnn-chile-role
  apiGroup: rbac.authorization.k8s.io
