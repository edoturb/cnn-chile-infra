<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CC0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo del logo -->
  <rect x="0" y="0" width="200" height="50" fill="url(#logoGradient)" rx="5"/>
  
  <!-- Texto CNN -->
  <text x="15" y="32" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">CNN</text>
  
  <!-- Texto Chile -->
  <text x="85" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="white">Chile</text>
  
  <!-- Icono de broadcast -->
  <circle cx="170" cy="25" r="8" fill="white" opacity="0.8"/>
  <circle cx="170" cy="25" r="4" fill="#CC0000"/>
  
  <!-- Líneas de señal -->
  <path d="M 160 15 Q 165 20 160 25 Q 165 30 160 35" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 155 12 Q 162 18 155 25 Q 162 32 155 38" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
